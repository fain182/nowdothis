[package]
name = "nowdothis"
version = "0.1.0"
edition = "2021"

[features]
# Adds a hook that renders the window to a PNG; see scripts/screenshots.sh.
screenshot = []

[dependencies]
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { version = "0.9", package = "gtk4", features = ["gnome_47"] }
serde_json = "1"
soup = { version = "0.7", package = "soup3" }

[dependencies.adw]
package = "libadwaita"
version = "0.7"
features = ["v1_6"]
